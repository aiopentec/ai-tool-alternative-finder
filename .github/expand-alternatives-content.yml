name: Expand Alternatives Content

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even already-cached pages (true/false)"
        required: false
        default: "false"

jobs:
  expand-alternatives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run expand_alternatives_content.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/expand_alternatives_content.py \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cache/alternatives
          git diff --staged --quiet || git commit -m "Expand alternatives-to-* content [automated]"
          git push
