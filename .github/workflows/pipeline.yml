name: Generate & Build AI Tool Alternative Finder

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'Batch index to generate (1–8, or blank for all missing)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force regenerate all comparisons even if cached'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write

jobs:
  generate:
    name: Generate Comparison Content
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore comparison cache
        uses: actions/cache@v4
        with:
          path: .cache/comparisons
          key: comparisons-${{ hashFiles('data/tool_pairs.json') }}-${{ github.run_number }}
          restore-keys: |
            comparisons-${{ hashFiles('data/tool_pairs.json') }}-
            comparisons-

      - name: Generate comparisons (batch mode)
        if: ${{ github.event.inputs.batch_index != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate.py --index ${{ github.event.inputs.batch_index }}

      - name: Generate comparisons (all missing)
        if: ${{ github.event.inputs.batch_index == '' && github.event.inputs.force_rebuild != 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate.py

      - name: Generate comparisons (force all)
        if: ${{ github.event.inputs.force_rebuild == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate.py --force

      - name: Report cache status
        run: |
          CACHED=$(ls .cache/comparisons/*.json 2>/dev/null | wc -l || echo 0)
          TOTAL=$(python -c "import json; d=json.load(open('data/tool_pairs.json')); print(len(d['pairs']))")
          echo "✅ Cached: $CACHED / $TOTAL comparisons"

      - name: Save comparison cache
        uses: actions/cache@v4
        with:
          path: .cache/comparisons
          key: comparisons-${{ hashFiles('data/tool_pairs.json') }}-${{ github.run_number }}

  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    needs: generate
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore comparison cache
        uses: actions/cache@v4
        with:
          path: .cache/comparisons
          key: comparisons-${{ hashFiles('data/tool_pairs.json') }}-${{ github.run_number }}
          restore-keys: |
            comparisons-${{ hashFiles('data/tool_pairs.json') }}-
            comparisons-

      - name: Build site
        env:
          SITE_BASE_URL: 'https://aiopentec.github.io/ai-tool-alternative-finder'
          GA_ID: ${{ secrets.GA_ID }}
          ADSENSE_ID: ${{ secrets.ADSENSE_ID }}
        run: |
          python scripts/build.py --cache .cache/comparisons --out site

      - name: Report build output
        run: |
          PAGES=$(find site -name '*.html' | wc -l)
          echo "✅ Built $PAGES HTML pages"
          echo "📁 Top-level contents:"
          ls site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: auto-rebuild site [${{ github.run_number }}]'
          force_orphan: false
