name: Generate & Build AI Tool Alternative Finder

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'       # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all comparisons (ignore cache)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      limit:
        description: 'Only generate N comparisons (0 = all). Useful for testing.'
        required: false
        default: '0'

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — GENERATE
# Calls Groq API to write comparison content for any new/missing tool pairs.
# Skips pairs that are already cached unless force_regenerate=true.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  generate:
    name: Generate Comparisons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Show cache status before generation
        run: |
          echo "=== Cached comparisons before generation ==="
          if [ -d ".cache/comparisons" ]; then
            COUNT=$(ls .cache/comparisons/*.json 2>/dev/null | wc -l)
            echo "Found $COUNT cached comparison files"
            ls .cache/comparisons/ | head -20
          else
            echo "No cache directory found — full generation required"
          fi

      - name: Generate comparisons
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          LIMIT_FLAG=""

          if [ "${{ github.event.inputs.force_regenerate }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "Force regenerate mode enabled"
          fi

          if [ "${{ github.event.inputs.limit }}" != "0" ] && [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ github.event.inputs.limit }}"
            echo "Limit mode: ${{ github.event.inputs.limit }} comparisons"
          fi

          python scripts/generate.py $FORCE_FLAG $LIMIT_FLAG

      - name: Show cache status after generation
        run: |
          echo "=== Cached comparisons after generation ==="
          if [ -d ".cache/comparisons" ]; then
            COUNT=$(ls .cache/comparisons/*.json 2>/dev/null | wc -l)
            echo "Total: $COUNT comparison files"
            ls .cache/comparisons/
          else
            echo "WARNING: .cache/comparisons does not exist"
          fi

      - name: Upload comparison cache as artifact
        uses: actions/upload-artifact@v4
        with:
          name: comparisons-cache
          path: .cache/comparisons/
          if-no-files-found: warn
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — BUILD & PUBLISH
# Downloads the generated cache, runs build.py, commits and pushes all HTML.
# Falls back to hardcoded data in build.py if no cache was generated.
# ─────────────────────────────────────────────────────────────────────────────

  build:
    name: Build & Publish Site
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download comparison cache from Generate job
        uses: actions/download-artifact@v4
        with:
          name: comparisons-cache
          path: .cache/comparisons/
        continue-on-error: true    # Build continues with fallback data if no cache

      - name: Check data source
        run: python scripts/build.py --check

      - name: Build site
        run: python scripts/build.py

      - name: Count generated files
        run: |
          echo "=== Generated HTML files ==="
          find . -name "index.html" | grep -v ".git" | wc -l
          echo "=== Sitemap URLs ==="
          grep "<url>" sitemap.xml | wc -l

      - name: Commit generated cache + site to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage generated cache (so it persists between runs)
          git add .cache/comparisons/ 2>/dev/null || true

          # Stage all HTML + sitemap + supporting files
          git add -A

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — site is already up to date"
          else
            COMP_COUNT=$(ls .cache/comparisons/*.json 2>/dev/null | wc -l || echo "fallback")
            git commit -m "Auto-build: $(date -u '+%Y-%m-%d %H:%M UTC') — ${COMP_COUNT} comparisons"
            echo "Committed successfully"
          fi

      - name: Push to GitHub
        run: git push

      - name: Pipeline summary
        run: |
          echo ""
          echo "========================================="
          echo "  PIPELINE COMPLETE"
          echo "========================================="
          echo "  Site URL: https://aiopentec.github.io/ai-tool-alternative-finder/"
          CACHE_COUNT=$(ls .cache/comparisons/*.json 2>/dev/null | wc -l || echo "0")
          echo "  Cached comparisons: $CACHE_COUNT"
          HTML_COUNT=$(find . -name "index.html" | grep -v ".git" | wc -l)
          echo "  HTML pages built: $HTML_COUNT"
          SITEMAP_URLS=$(grep "<url>" sitemap.xml | wc -l)
          echo "  Sitemap URLs: $SITEMAP_URLS"
          echo "========================================="
